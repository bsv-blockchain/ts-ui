name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Verify native runtime
        run: node -e "if(process.versions.node!=='22.23.4')throw Error(process.versions.node);const z=require('node:zlib');const b=Buffer.from('runtime');if(!z.brotliDecompressSync(z.brotliCompressSync(b)).equals(b))throw Error('Brotli');require('node:crypto').randomBytes(16)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r run build

      - name: Lint all packages
        run: pnpm -r --if-present run lint

      - name: Test all packages
        run: pnpm -r --if-present run test
